<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veritas-Chain · synthetic network explorer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div>
      <h1>Veritas-Chain</h1>
      <p class="notice" id="notice">All data is synthetic. No real people, numbers, accounts or law-enforcement records.</p>
    </div>
    <p id="graph-stats" class="muted">Loading…</p>
  </header>

  <main>
    <aside id="sidebar" aria-label="Centrality rankings">
      <h2>Top-ranked people</h2>
      <label>Metric
        <select id="metric">
          <option value="betweenness">Betweenness (brokers)</option>
          <option value="pagerank">PageRank (influence)</option>
          <option value="degree">Degree (distinct contacts)</option>
        </select>
      </label>
      <label>Evidence
        <select id="variant">
          <option value="structured_only">Structured records only</option>
          <option value="no_cooccurrence">Without same-sentence links</option>
          <option value="all_evidence">All evidence</option>
        </select>
      </label>
      <ol id="ranking"></ol>
      <p id="ranking-note" class="muted small"></p>
    </aside>

    <section id="graph-panel" aria-label="Graph">
      <div id="toolbar">
        <button id="show-all" type="button">Full graph</button>
        <button id="focus" type="button" disabled>Neighbourhood of selection</button>
        <label>Depth
          <select id="depth"><option>1</option><option selected>2</option><option>3</option></select>
        </label>
        <span id="view-label" class="muted"></span>
      </div>
      <div id="cy"></div>
      <ul id="legend" aria-label="Node types"></ul>
    </section>

    <aside id="right" aria-label="Details and audit trail">
      <section id="details">
        <h2>Details</h2>
        <div id="details-body"><p class="muted">Click a node or an edge.</p></div>
      </section>
      <section id="audit">
        <h2>Audit trail</h2>
        <div id="verify-status" class="status unknown">Chain not verified yet</div>
        <button id="verify" type="button">Verify chain</button>
        <div id="history"><p class="muted">Select a node or edge to see the blocks that recorded it.</p></div>
      </section>
    </aside>
  </main>

  <script src="/static/vendor/cytoscape.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
